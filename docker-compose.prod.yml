services:
  db:
    image: postgres:15.8-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    networks:
      - app-network

  backend:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER}/mi-tech-backend:${IMAGE_TAG:?IMAGE_TAG is required}
    restart: always
    environment:
      DB_DSN: postgres://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/${POSTGRES_DB:?POSTGRES_DB is required}?sslmode=disable
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      DB_NAME: ${POSTGRES_DB:?POSTGRES_DB is required}
      ADMIN_USERNAME: ${ADMIN_USERNAME:?ADMIN_USERNAME is required}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      ENABLE_TELEMETRY: ${ENABLE_TELEMETRY:-true}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-tempo:4317}
      # Add other necessary backend environment variables here
    depends_on:
      - db
    volumes:
      - backend_uploads:/app/uploads
    networks:
      - app-network

  frontend:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER}/mi-tech-frontend:${IMAGE_TAG:?IMAGE_TAG is required}
    restart: always
    networks:
      - app-network

  frontend-feedback:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER}/mi-tech-frontend-feedback:${IMAGE_TAG:?IMAGE_TAG is required}
    restart: always
    networks:
      - app-network

  nginx:
    image: nginx:1.27-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
      - /var/www/html/f-images:/var/www/html/f-images:ro
    depends_on:
      - frontend
      - frontend-feedback
      - backend
    networks:
      - app-network

  certbot:
    image: certbot/certbot:v3.1.0
    restart: always
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;"
    networks:
      - app-network

  shop-chat-agent:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER}/mi-tech-shop-chat-agent:${IMAGE_TAG:?IMAGE_TAG is required}
    restart: always
    environment:
      DATABASE_URL: "file:dev.sqlite"
      PORT: 3000
      OPENAI_API_KEY: ${OPENAI_API_KEY:?OPENAI_API_KEY is required}
      SHOPIFY_API_KEY: ${SHOPIFY_API_KEY:?SHOPIFY_API_KEY is required}
      SHOPIFY_API_SECRET: ${SHOPIFY_API_SECRET:?SHOPIFY_API_SECRET is required}
      SHOPIFY_APP_URL: "https://shop-chat-agent.millennialperfumer.in"
      APP_URL: "https://shop-chat-agent.millennialperfumer.in"
      REDIRECT_URL: "https://shop-chat-agent.millennialperfumer.in/auth/callback"
      SCOPES: "unauthenticated_read_product_listings"
    volumes:
      - shop_chat_db_data:/app/prisma
    networks:
      - app-network

networks:
  app-network:
    name: app-network
    driver: bridge

volumes:
  postgres_data_prod:
  backend_uploads:
  shop_chat_db_data:
