events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Allow up to 100M for media uploads (photos, videos, carousels)
    client_max_body_size 100M;

    # Nginx reverse proxy configuration
    # Docker's internal DNS resolver
    resolver 127.0.0.11 valid=30s;

    # SSL shared configuration
    ssl_certificate /etc/letsencrypt/live/mi-tech.millennialperfumer.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mi-tech.millennialperfumer.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Frontend block (HTTPS)
    server {
        listen 443 ssl;
        server_name mi-tech.millennialperfumer.in;

        # NEW: Route for Flipkart images
        location /f-images/ {
            alias /var/www/html/f-images/;
            autoindex off;
            access_log off;
            expires max;
            add_header Access-Control-Allow-Origin *;
        }

        location / {
            set $frontend_upstream http://frontend:80;
            proxy_pass $frontend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # Feedback Frontend block (HTTPS)
    server {
        listen 443 ssl;
        server_name feedback-form.millennialperfumer.in;

        location / {
            set $feedback_upstream http://frontend-feedback:80;
            proxy_pass $feedback_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # Meta Graph API MCP gateway (Streamable HTTP).
    # The upstream verifies the forwarded Bearer token; never expose it without
    # MCP_HTTP_AUTH_TOKEN configured in docker-compose.prod.yml.
    server {
        listen 443 ssl;
        server_name mcp.millennialperfumer.in;

        location = /meta-mcp-server {
            # The service serves MCP at /mcp, while the public URL stays namespaced.
            # Use an explicit URI here: the variable-based proxy_pass caused
            # Nginx to evaluate an empty upstream URL during MCP POSTs.
            proxy_pass http://meta-mcp-server:3000/mcp;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Streamable HTTP / SSE support.
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_cache off;
            proxy_buffering off;
            chunked_transfer_encoding on;
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
        }

        # Keep clients on the canonical MCP endpoint; a trailing slash would
        # otherwise be a different route to the upstream server.
        location = /meta-mcp-server/ {
            return 308 /meta-mcp-server;
        }

        # GitHub MCP gateway. The service serves MCP at /github/mcp, while the
        # public URL stays namespaced alongside the Meta gateway.
        location = /github-mcp-server {
            proxy_pass http://github-mcp-server:3001/github/mcp;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;

            # Streamable HTTP / SSE support.
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_cache off;
            proxy_buffering off;
            chunked_transfer_encoding on;
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
        }

        location = /github-mcp-server/ {
            return 308 /github-mcp-server;
        }

        location = /healthz {
            set $meta_mcp_upstream http://meta-mcp-server:3000;
            proxy_pass $meta_mcp_upstream;
            proxy_set_header Host $host;
        }

        location = /github-mcp-healthz {
            proxy_pass http://github-mcp-server:3001/healthz;
            proxy_set_header Host $host;
        }

        location / {
            return 404;
        }
    }

    # API block (HTTPS)
    server {
        listen 443 ssl;
        server_name mi-tech-api.millennialperfumer.in;

        client_max_body_size 100M;

        # MCP Streamable HTTP endpoint (read-only tools over machine-key auth).
        # Requires SSE-friendly proxying and CORS for browser-based clients.
        location /mcp {
            set $backend_upstream http://backend:8080;
            proxy_pass $backend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Streaming / SSE support for MCP (Streamable HTTP 2025-03-26)
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_cache off;
            proxy_buffering off;
            chunked_transfer_encoding on;
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;

            # CORS for browser-based MCP clients (auth is header-based, not cookies)
            if ($request_method = 'OPTIONS') {
                add_header Access-Control-Allow-Origin *;
                add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS';
                add_header Access-Control-Allow-Headers 'Authorization, Content-Type, Accept, MCP-Protocol-Version, MCP-Session-Id';
                add_header Access-Control-Max-Age 86400;
                return 204;
            }
            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS' always;
            add_header Access-Control-Allow-Headers 'Authorization, Content-Type, Accept, MCP-Protocol-Version, MCP-Session-Id' always;
        }

        location / {
            set $backend_upstream http://backend:8080;
            proxy_pass $backend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # Monitoring block (HTTPS)
    server {
        listen 443 ssl;
        server_name mi-tech-monitoring.millennialperfumer.in;
        ssl_certificate /etc/letsencrypt/live/mi-tech.millennialperfumer.in/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/mi-tech.millennialperfumer.in/privkey.pem;

        # Protect monitoring with application RBAC
        auth_request /api/auth/verify;
        auth_request_set $auth_user $sent_http_x_webauth_user;
        auth_request_set $auth_role $sent_http_x_webauth_role;

        location / {
            set $grafana_upstream http://grafana:3000;
            proxy_pass $grafana_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket support
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Pass authenticated user and role to Grafana Auth Proxy
            proxy_set_header X-WEBAUTH-USER $auth_user;
            proxy_set_header X-WEBAUTH-ROLE $auth_role;
        }

        # Internal location for auth verification
        location = /api/auth/verify {
            internal;
            set $auth_backend http://backend:8080;
            proxy_pass $auth_backend;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URI $request_uri;
            # Forward the original Authorization header
            proxy_set_header Authorization $http_authorization;
        }
    }

    # Shop Chat Agent block (HTTPS)
    server {
        listen 443 ssl;
        server_name shop-chat-agent.millennialperfumer.in;

        location / {
            set $agent_upstream http://shop-chat-agent:3000;
            proxy_pass $agent_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Critical for Server-Sent Events (OpenAI response streaming)
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_cache off;
            proxy_buffering off;
            chunked_transfer_encoding on;
            proxy_read_timeout 24h;
        }
    }

    # n8n Automation Engine block (HTTPS)
    server {
        listen 443 ssl;
        server_name n8n.millennialperfumer.in;
        ssl_certificate /etc/letsencrypt/live/n8n.millennialperfumer.in/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/n8n.millennialperfumer.in/privkey.pem;

        client_max_body_size 100M;

        location / {
            set $n8n_upstream http://n8n:5678;
            proxy_pass $n8n_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket & SSE streaming support for live execution canvas
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_cache off;
            proxy_buffering off;
            chunked_transfer_encoding on;
            proxy_read_timeout 24h;
        }
    }

    # HTTP to HTTPS Redirects & Certbot Challenges
    server {
        listen 80;
        server_name mi-tech.millennialperfumer.in mi-tech-api.millennialperfumer.in mi-tech-monitoring.millennialperfumer.in feedback-form.millennialperfumer.in shop-chat-agent.millennialperfumer.in n8n.millennialperfumer.in mcp.millennialperfumer.in;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }
}
