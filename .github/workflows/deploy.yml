name: Build and Deploy

on:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  REPO_OWNER: ${{ github.repository_owner }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - service: backend
            context: ./backend
            image_name: mi-tech-backend
            build_args: ""
          - service: frontend
            context: ./frontend
            image_name: mi-tech-frontend
            build_args: "VITE_API_URL=https://mi-tech-api.millennialperfumer.in"
          - service: frontend-feedback
            context: ./frontend-feedback
            image_name: mi-tech-frontend-feedback
            build_args: "VITE_API_URL=https://mi-tech-api.millennialperfumer.in"
          - service: frontend-v2
            context: ./frontend-v2
            image_name: mi-tech-frontend-v2
            build_args: "VITE_API_URL=https://mi-tech-api.millennialperfumer.in"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Lowercase Repository Owner
        run: |
          echo "REPO_OWNER=${REPO_OWNER,,}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.MITECH_DOCKER_TOKEN }}

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          push: true
          build-args: ${{ matrix.build_args }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.REPO_OWNER }}/${{ matrix.image_name }}:latest
            ${{ env.REGISTRY }}/${{ env.REPO_OWNER }}/${{ matrix.image_name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy-to-vm:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Lowercase Repository Owner
        run: |
          echo "REPO_OWNER=${REPO_OWNER,,}" >> $GITHUB_ENV

      - name: Copy deployment files to VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          password: ${{ secrets.VM_PASSWORD }}
          key: ${{ secrets.VM_SSH_KEY }}
          port: ${{ secrets.VM_PORT || 22 }}
          timeout: 60s
          command_timeout: 10m
          use_insecure_cipher: true
          source: "docker-compose.prod.yml,docker-compose.monitoring.yml,nginx/,monitoring/,init-ssl.sh"
          target: "~/mi-tech-app"

      - name: Deploy on VM
        uses: appleboy/ssh-action@v1.0.3
        env:
          REPO_OWNER: ${{ env.REPO_OWNER }}
          # These remain GitHub Actions secrets and are forwarded only to the
          # Compose process on the VM; they are never written to a server .env.
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          MCP_HTTP_AUTH_TOKEN: ${{ secrets.MCP_HTTP_AUTH_TOKEN }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          PAT_GITHUB: ${{ secrets.PAT_GITHUB }}
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          password: ${{ secrets.VM_PASSWORD }}
          key: ${{ secrets.VM_SSH_KEY }}
          port: ${{ secrets.VM_PORT || 22 }}
          timeout: 60s
          command_timeout: 10m
          use_insecure_cipher: true
          envs: REPO_OWNER,META_ACCESS_TOKEN,MCP_HTTP_AUTH_TOKEN,THREADS_ACCESS_TOKEN,PAT_GITHUB
          script: |
            set -eu
            cd ~/mi-tech-app

            # Login to GHCR on the VM
            echo ${{ secrets.MITECH_DOCKER_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Export GITHUB_REPOSITORY_OWNER for docker-compose.prod.yml
            export GITHUB_REPOSITORY_OWNER=$REPO_OWNER
            export IMAGE_TAG=${{ github.sha }}
            export GITHUB_PERSONAL_ACCESS_TOKEN=$PAT_GITHUB

            # Fast targeted pull of custom app images
            docker compose -f docker-compose.prod.yml pull backend frontend frontend-feedback frontend-v2 meta-mcp-server github-mcp-server

            # Recreate containers with zero unnecessary downtime
            docker compose -f docker-compose.prod.yml up -d --no-deps backend frontend frontend-feedback frontend-v2 meta-mcp-server github-mcp-server nginx

            # Ensure n8n is linked to app network for reverse proxying
            docker network connect mi-tech-app_app-network n8n 2>/dev/null || true

            # Reload Nginx configuration
            docker compose -f docker-compose.prod.yml exec -T nginx nginx -s reload 2>/dev/null || true

            # Remove only dangling (untagged) images without wiping layer cache
            docker image prune -f
